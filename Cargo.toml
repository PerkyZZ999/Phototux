[workspace]
resolver = "2"
members = [
    "crates/phototux",
    "crates/phototux-ui",
    "crates/phototux-engine",
    "crates/phototux-gpu",
    "crates/phototux-canvas",
    "crates/phototux-spike-interop",
    "crates/phototux-io",
]
default-members = ["crates/phototux"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
version = "0.1.0"
rust-version = "1.87"

[workspace.dependencies]
qtbridge = "0.2.0"
phototux_engine = { path = "crates/phototux-engine" }
phototux_ui = { path = "crates/phototux-ui" }
phototux_canvas = { path = "crates/phototux-canvas" }
phototux_gpu = { path = "crates/phototux-gpu" }
phototux_io = { path = "crates/phototux-io" }
image = { version = "=0.25.9", default-features = false }
percent-encoding = "2.3.2"
thiserror = "2.0.18"
pollster = "1.0.1"
cc = "1.2.67"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
arboard = "3.4"
flate2 = "1.1.1"
crc32fast = "1.4.2"
