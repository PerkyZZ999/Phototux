[workspace]
resolver = "2"
members = [
    "crates/phototux",
    "crates/phototux-ui",
    "crates/phototux-engine",
    "crates/phototux-gpu",
    "crates/phototux-canvas",
    "crates/phototux-spike-interop",
    "crates/phototux-io",
]
default-members = ["crates/phototux"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
version = "0.1.0"
rust-version = "1.87"

[workspace.dependencies]
qtbridge = "0.2.0"
phototux_engine = { path = "crates/phototux-engine" }
phototux_ui = { path = "crates/phototux-ui" }
phototux_canvas = { path = "crates/phototux-canvas" }
phototux_gpu = { path = "crates/phototux-gpu" }
phototux_io = { path = "crates/phototux-io" }
image = { version = "=0.25.9", default-features = false }
percent-encoding = "2.3.2"
thiserror = "2.0.18"
pollster = "1.0.1"
cc = "1.2.67"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
arboard = "3.4"
flate2 = "1.1.1"
crc32fast = "1.4.2"

# Shipping profile for the interactive editor. The SLOs in ADR-008 (60+ FPS
# zoom/pan, < 8 ms tablet input→render) are cross-crate hot paths: the brush
# stream crosses phototux_ui → phototux_canvas → phototux_gpu on every dab, so
# cross-crate inlining is worth the longer link.
[profile.release]
lto = "thin"
codegen-units = 1

# Codec/compression work (image, flate2, moxcms) dominates open/save on debug
# builds and makes the developer loop unusable on large documents. Optimize
# dependencies while keeping our own crates debuggable.
[profile.dev.package."*"]
opt-level = 2
