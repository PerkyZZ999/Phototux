<!DOCTYPE html>

                    "inverse-primary": "#00658e",
                    "on-tertiary-fixed": "#321200",
                    "canvas-letterbox": "#0C0C0E",
                    "surface-tint": "#84cfff",
                    "outline": "#88929a",
                    "tertiary": "#ffb68c",
                    "primary-fixed": "#c7e7ff",

            "fontSize": {

                    "headline-md": [

                            "10px",

                    ],
                    "label-md": [
                            "11px",
                            {
                                    "lineHeight": "1.2",
                                    "letterSpacing": "0.01em",
                                    "fontWeight": "500"

                    ],
                    "body-md": [
                            "12px",
                            {
                                    "lineHeight": "1.4",
                                    "letterSpacing": "0em",
                                    "fontWeight": "400"

                    ],
                    "window-title": [
                            "13px",
                            {
                                    "lineHeight": "1.2",
                                    "letterSpacing": "0em",
                                    "fontWeight": "600"

                    "mono-hud": [

</head>
<body class="bg-background text-on-surface h-screen w-screen overflow-hidden flex flex-col font-body-sm text-body-sm antialiased selection:bg-selection">
<!-- TopNavBar -->
<header class="bg-surface border-b border-border transition-colors duration-150 flex items-center px-panel-padding w-full h-[40px] z-50 shrink-0">
<div class="flex items-center gap-md">
<span class="font-window-title text-window-title text-on-surface">PhotoTux</span>
<nav class="hidden md:flex items-center gap-sm h-full">
<a class="font-window-title text-window-title text-on-surface hover:bg-secondary-container px-sm py-xs rounded transition-colors duration-150" href="#">File</a>
<a class="font-window-title text-window-title text-on-surface hover:bg-secondary-container px-sm py-xs rounded transition-colors duration-150" href="#">Edit</a>
<a class="font-window-title text-window-title text-on-surface hover:bg-secondary-container px-sm py-xs rounded transition-colors duration-150" href="#">Select</a>
<a class="font-window-title text-window-title text-on-surface hover:bg-secondary-container px-sm py-xs rounded transition-colors duration-150" href="#">View</a>
<a class="font-window-title text-window-title text-on-surface hover:bg-secondary-container px-sm py-xs rounded transition-colors duration-150" href="#">Window</a>
<a class="font-window-title text-window-title text-on-surface hover:bg-secondary-container px-sm py-xs rounded transition-colors duration-150" href="#">Help</a>
</nav>
</div>
<div class="ml-auto flex items-center gap-sm">
<button class="w-[28px] h-[28px] flex items-center justify-center rounded hover:bg-secondary-container text-on-surface transition-colors duration-150">
<span class="material-symbols-outlined text-[18px]">settings</span>
</button>
<button class="w-[28px] h-[28px] flex items-center justify-center rounded hover:bg-secondary-container text-on-surface transition-colors duration-150">
<span class="material-symbols-outlined text-[18px]">help</span>
</button>
</div>
</header>
<!-- Workspace Area (Background for Modal) -->
<div class="flex-1 flex relative overflow-hidden bg-surface-sunken">
<!-- Tool Strip -->
<aside class="w-tool-strip-width bg-surface border-r border-border flex flex-col items-center py-xs shrink-0 z-40 relative">
<button class="w-[36px] h-[36px] flex flex-col items-center justify-center mb-xs rounded hover:bg-surface-container-high text-on-surface-variant transition-all duration-75 relative group">
<span class="material-symbols-outlined text-[20px]">near_me</span>
<span class="font-label-sm text-label-sm mt-[2px] hidden group-hover:block absolute left-full ml-xs bg-surface-raised px-sm py-[2px] rounded border border-border text-on-surface whitespace-nowrap z-50">Move</span>
</button>
<button class="w-[36px] h-[36px] flex flex-col items-center justify-center mb-xs rounded hover:bg-surface-container-high text-on-surface-variant transition-all duration-75 relative group">
<span class="material-symbols-outlined text-[20px]">elevation</span>
</button>
<button class="w-[36px] h-[36px] flex flex-col items-center justify-center mb-xs rounded hover:bg-surface-container-high text-on-surface-variant transition-all duration-75 relative group">
<span class="material-symbols-outlined text-[20px]">gesture</span>
</button>
<button class="w-[36px] h-[36px] flex flex-col items-center justify-center mb-xs rounded hover:bg-surface-container-high text-on-surface-variant transition-all duration-75 relative group">
<span class="material-symbols-outlined text-[20px]">brush</span>
</button>
<div class="mt-auto pb-sm">
<button class="w-[36px] h-[36px] flex flex-col items-center justify-center rounded hover:bg-surface-container-high text-on-surface-variant transition-all duration-75 relative group">
<span class="material-symbols-outlined text-[20px]">settings</span>
</button>
</div>
</aside>
<!-- Canvas Area (Dimmed behind modal) -->
<main class="flex-1 relative flex items-center justify-center p-xl">
<div class="absolute inset-0 bg-black/50 backdrop-blur-sm z-40 flex items-center justify-center p-xl">
<!-- Export Dialog Modal -->
<div class="w-[800px] h-[540px] bg-surface rounded-lg border border-border shadow-2xl flex flex-col overflow-hidden">
<!-- Dialog Header -->
<div class="h-[40px] px-panel-padding flex items-center justify-between border-b border-border bg-surface shrink-0 cursor-default">
<h2 class="font-window-title text-window-title text-on-surface">Export Image</h2>
<button class="w-[24px] h-[24px] flex items-center justify-center rounded hover:bg-error/20 hover:text-error text-on-surface-variant transition-colors">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
<!-- Dialog Body -->
<div class="flex-1 flex overflow-hidden">
<!-- Left: Preview Area -->
<div class="flex-1 bg-surface-sunken border-r border-border flex flex-col relative">
<!-- Checkerboard Background for transparency preview -->
<div class="absolute inset-0 z-0" style="background-image: linear-gradient(45deg, #1f1f23 25%, transparent 25%), linear-gradient(-45deg, #1f1f23 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1f1f23 75%), linear-gradient(-45deg, transparent 75%, #1f1f23 75%); background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0px;"></div>
<div class="flex-1 flex items-center justify-center p-lg z-10 relative">
<img class="max-w-full max-h-full object-contain border border-border shadow-lg" data-alt="A high-resolution macro photograph of a vividly colored, iridescent metallic beetle resting on a textured, dark slate surface. The lighting is dramatic, highlighting the microscopic details of the carapace and casting sharp, cinematic shadows. The overall aesthetic is hyper-realistic, scientific, and sophisticated, fitting a professional creative workspace environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCsgmGU33VIx-iGMBamffWRNgNUNwOSjZm2OiA_GktODF5yo98torqCSevLyZi3ydz6C7WDhBp6hb3eFRuRhAkJsnK8DkjRp6FuWak2-8m3Qk_uF9jINXkGZEPrhqUwBGPWod-ucdrfEt4_9FcO-5n-AbGlLbeb4Um_g8XsgCIKuZaryuAuNbG9BVZLY0B3E2BYfUjMRFm4PTrBRNtFumDxB2SLin2B1ZGN19M2EPQtQRpJu-7uQvqCyCN7rKh9ZKIflwk4zvvEZmU"/>
</div>
<!-- Preview Status Bar -->
<div class="h-[28px] bg-surface border-t border-border flex items-center px-panel-padding justify-between z-10 shrink-0">
<span class="font-mono-hud text-mono-hud text-on-surface-muted">Zoom: 100%</span>
<span class="font-mono-hud text-mono-hud text-on-surface-muted">Est. Size: 4.2 MB</span>
</div>
</div>
<!-- Right: Settings Panel -->
<div class="w-[320px] bg-surface flex flex-col shrink-0 overflow-y-auto">
<div class="p-panel-padding flex flex-col gap-lg">
<!-- File Settings Section -->
<section>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-control-gap">File Settings</h3>
<div class="flex flex-col gap-control-gap">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Format</label>
<div class="relative">
<select class="w-full h-[28px] bg-surface-overlay border border-border rounded px-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary appearance-none cursor-pointer">
<option value="png">PNG - Portable Network Graphics</option>
<option selected="" value="jpg">JPEG - Joint Photographic Experts Group</option>
<option value="tiff">TIFF - Tagged Image File Format</option>
<option value="webp">WebP</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-[16px]">arrow_drop_down</span>
</div>
</div>
<div class="flex flex-col gap-xs mt-sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant">Quality</label>
<span class="font-mono-hud text-mono-hud text-primary">85%</span>
</div>
<input class="w-full h-[4px] bg-border rounded appearance-none outline-none cursor-pointer [&amp;::-webkit-slider-thumb]:appearance-none [&amp;::-webkit-slider-thumb]:w-[12px] [&amp;::-webkit-slider-thumb]:h-[12px] [&amp;::-webkit-slider-thumb]:bg-primary [&amp;::-webkit-slider-thumb]:rounded-full" max="100" min="1" type="range" value="85"/>
</div>
</div>
</section>
<div class="h-px bg-border w-full"></div>
<!-- Image Size Section -->
<section>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-control-gap">Image Size</h3>
<div class="grid grid-cols-2 gap-control-gap">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Width (px)</label>
<input class="w-full h-[28px] bg-surface-overlay border border-border rounded px-sm font-mono-hud text-mono-hud text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" type="number" value="3840"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Height (px)</label>
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-on-surface-muted text-[16px] cursor-pointer hover:text-primary transition-colors" title="Constrain Proportions">link</span>
<input class="w-full h-[28px] bg-surface-overlay border border-border rounded px-sm font-mono-hud text-mono-hud text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" type="number" value="2160"/>
</div>
</div>
</div>
<div class="flex flex-col gap-xs mt-control-gap">
<label class="font-label-md text-label-md text-on-surface-variant">Resample</label>
<div class="relative">
<select class="w-full h-[28px] bg-surface-overlay border border-border rounded px-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary appearance-none cursor-pointer">
<option value="bicubic">Bicubic Automatic</option>
<option value="nearest">Nearest Neighbor (Hard Edges)</option>
<option value="bilinear">Bilinear</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-[16px]">arrow_drop_down</span>
</div>
</div>
</section>
<div class="h-px bg-border w-full"></div>
<!-- Advanced Options Section -->
<section>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-control-gap">Advanced</h3>
<div class="flex flex-col gap-control-gap">
<label class="flex items-center gap-sm cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-[16px] h-[16px] border border-border rounded bg-surface-overlay checked:bg-primary checked:border-primary focus:outline-none focus:ring-1 focus:ring-primary focus:ring-offset-1 focus:ring-offset-surface cursor-pointer transition-colors" type="checkbox"/>
<span class="material-symbols-outlined absolute text-on-primary text-[14px] opacity-0 peer-checked:opacity-100 pointer-events-none">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Embed Color Profile (sRGB)</span>
</label>
<label class="flex items-center gap-sm cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-[16px] h-[16px] border border-border rounded bg-surface-overlay checked:bg-primary checked:border-primary focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed transition-colors" disabled="" type="checkbox"/>
<span class="material-symbols-outlined absolute text-on-primary text-[14px] opacity-0 peer-checked:opacity-100 pointer-events-none">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface-disabled">Transparency (Requires PNG/TIFF)</span>
</label>
</div>
</section>
</div>
</div>
</div>
<!-- Dialog Footer / Actions -->
<div class="h-[52px] bg-surface-container border-t border-border px-panel-padding flex items-center justify-end gap-sm shrink-0">
<button class="h-[28px] px-lg rounded bg-surface-raised border border-border font-label-md text-label-md text-on-surface hover:bg-surface-container-highest hover:text-white transition-colors duration-150">
                            Cancel
                        </button>
<button class="h-[28px] px-lg rounded bg-primary font-label-md text-label-md text-on-primary hover:bg-primary-fixed-dim transition-colors duration-150 shadow-sm">
                            Export
                        </button>
</div>
</div>
</div>
</main>
</div>
<!-- Footer -->
<footer class="bg-surface-container border-t border-border flex justify-between items-center px-md w-full h-[28px] z-50 shrink-0">
<span class="font-mono-hud text-mono-hud text-on-surface-muted">RGBA: 255, 255, 255, 1.0 | 3000 x 2000 px | 72 DPI</span>
<div class="flex items-center gap-md">
<span class="font-mono-hud text-mono-hud text-on-surface-muted hover:text-on-surface cursor-pointer">GPU ACCELERATED</span>
</div>
</footer>
</body></html>
