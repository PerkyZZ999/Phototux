# Project config for rust-doctor pre-commit / agent scans.
# See: rust-doctor skill + `rust-doctor --help`
#
# Primary quality gate remains scripts/check-rust.sh `--fail-on error`.
# Scope (owner 2026-07-15): fix first-party correctness/perf/config;
# retain reviewed exclusions for publication/workspace noise, intentional
# FFI audit noise, and build-script paths.
#
# Residual noise (accepted, not chaseable via ignore allowlist):
# - pedantic Clippy from doctor's pass (`must_use_candidate`, …)
# - `clippy::multiple_crate_versions` (ignore key does not match diagnostic id)
# - third-party `unsafe-dependency` when cargo-geiger completes
# - coverage `skipped-pass` / geiger timeouts

fail_on = "error"
verbose = true

[score]
fail_below = 70

[ignore]
# Unreleased GPL app: crates.io metadata noise.
# `unused-dependency`: false positive on workspace `cc`/`pollster`.
# `unsafe-block-audit`: intentional FFI (ADR-003/005), SAFETY-commented.
rules = [
    "cargo_common_metadata",
    "multiple_crate_versions",
    "unused-dependency",
    "unsafe-block-audit",
]
# Build scripts may panic when Qt/CMake tooling is missing (expected).
files = [
    "**/build.rs",
]
