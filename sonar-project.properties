# PhotoTux — SonarQube Server analysis (local instance).
# Run via ./scripts/check-sonar.sh (also CHECK_SONAR=1 / --sonar on check-rust.sh).
# Do not put tokens in this file. Host/token come from SONAR_HOST_URL / SONAR_TOKEN
# or the gitignored .sonar/scanner-token written at project provisioning.

sonar.projectKey=phototux
sonar.projectName=PhotoTux
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

# Product sources. Handbook / third-party Phosphor icons stay out of the scan.
sonar.sources=crates,qml,scripts
sonar.exclusions=\
**/target/**,\
**/build/**,\
**/.qmlcache/**,\
**/moc_*.cpp,\
crates/phototux-spike-interop/**

# Same Clippy invocation as scripts/check-rust.sh. Disable the analyzer's own
# cargo clippy run so issues are not duplicated (Sonar Rust docs).
sonar.rust.clippy.enabled=false
sonar.rust.clippy.offline=true
sonar.rust.clippyReport.reportPaths=target/sonar/clippy-report.json
sonar.rust.cargo.manifestPaths=Cargo.toml

# QML / C++ / shell are not first-class languages on this Community Build.
# Include them in the text + secrets sensor (Rust sources are already included).
sonar.text.inclusions=**/*.qml,**/*.cpp,**/*.h,**/*.sh

sonar.scm.provider=git
sonar.qualitygate.wait=true
