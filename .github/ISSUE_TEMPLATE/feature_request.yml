name: Feature request
description: Something the editor should be able to do and cannot.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before writing: a few things are deliberately out of scope, and a
        request for one of them will be closed rather than considered. They
        are cloud storage and accounts, AI or generative features, telemetry,
        multi-window sessions, a CLI or TUI product, and Windows or macOS
        support for v1. The reasoning is in
        [CONTRIBUTING.md](https://github.com/PerkyZZ999/Phototux/blob/main/CONTRIBUTING.md#what-is-out-of-scope).

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        Describe the task, not the feature. "I need to line up six layers on
        their left edges" tells us more than "add an align panel".
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would solve it
      description: >
        If you have a shape in mind, describe it. If Photoshop, GIMP or Krita
        already solve this, say how — placement follows Photoshop where a
        well-known home exists.

  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: The workaround, if there is one.
